name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: composer test
      - name: Check code style
        run: vendor/bin/pint --test src/QueueLifecycleRecorder.php src/Support/PayloadMasker.php src/QueueMonitorServiceProvider.php database/migrations/2026_11_16_000000_create_queue_monitor_jobs_table.php
