name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: composer test
      - name: Check code style
        run: vendor/bin/pint --test src/QueueLifecycleRecorder.php src/Support/PayloadMasker.php src/QueueMonitorServiceProvider.php src/Drivers/LazyBeanstalkdConnection.php src/Drivers/BeanstalkdQueueDriver.php src/Drivers/BeanstalkdQueueDriverFactory.php src/Drivers/DatabaseQueueDriver.php src/Drivers/DatabaseQueueDriverFactory.php src/Drivers/RedisQueueDriver.php src/Drivers/RedisQueueDriverFactory.php src/Drivers/LazyRedisConnection.php src/Http/Controllers/DashboardController.php src/Http/Controllers/JobActionController.php src/Http/Controllers/JobDetailController.php src/Http/Controllers/JobCompareController.php src/WorkerHeartbeatRecorder.php tests/Feature/DashboardTest.php tests/Feature/JobActionTest.php tests/Unit/BeanstalkdQueueDriverTest.php tests/Unit/DatabaseQueueDriverTest.php tests/Unit/RedisQueueDriverTest.php database/migrations/2026_11_16_000000_create_queue_monitor_jobs_table.php database/migrations/2026_11_16_000001_create_queue_monitor_workers_table.php
